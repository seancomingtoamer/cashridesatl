<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cash Rides ATL · Taking a short break</title>
<meta name="description" content="Cash Rides ATL is taking a short break while we make some updates.">
<meta name="theme-color" content="#0a0a0a">
<style>
  :root {
    --bg: #0a0a0a;
    --fg: #f5f5f5;
    --text: #d4d4d4;
    --muted: #9ca3af;
    --green: #22c55e;
    --gold: #facc15;
    --card: #141414;
    --line: #2a2a2a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  main { width: 100%; max-width: 520px; text-align: center; }
  .brand {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--fg);
  }
  .brand span { color: var(--green); }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin: 32px 0 20px;
    padding: 6px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: var(--gold);
    font-size: 13px;
    font-weight: 600;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
  h1 { margin: 0 0 16px; font-size: clamp(28px, 7vw, 40px); line-height: 1.15; }
  p { margin: 0 0 10px; color: var(--text); font-size: 17px; }
  .foot { margin-top: 36px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <div class="brand">Cash Rides <span>ATL</span></div>
  <div class="badge"><span class="dot"></span>Paused for now</div>
  <h1>We're taking a short break.</h1>
  <p>Cash Rides ATL is paused while we make some updates.</p>
  <p>Thanks for your patience.</p>
  <div class="foot">Cash Rides ATL · Atlanta, GA</div>
</main>
</body>
</html>
